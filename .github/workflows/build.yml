name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk 465stats.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 465stats.apk
          path: 465stats.apk

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 465stats (build ${{ github.run_number }})
          body: "Install on the tablet: download 465stats.apk below and open it. Build ${{ github.run_number }} from commit ${{ github.sha }}."
          files: 465stats.apk
          make_latest: true
